[package]
name = "dst-rust-demo"
version = "0.1.0"
edition = "2024"

# The demo is dependency-free: the only dep is the generated Dagr crate, and the crypto
# (SHA-256/HMAC) is hand-rolled in src/sha256.rs. The `real-crypto` feature (used only by
# run_bench.sh) swaps HMAC-SHA256 to RustCrypto `hmac`+`sha2` — the same crate a real JWT
# lib (`jwt`) uses — so the benchmark reflects realistic, hardware-accelerated crypto
# instead of a scalar reference impl. HMAC-SHA256 is standard, so the token bytes are
# unchanged either way.
[dependencies]
dagr_signed_token = { path = "../../gen/rust" }
# Bench-only (all optional): `real-crypto` swaps Dagr's HMAC to `ring` (asm SHA-256 — the
# same crate `jsonwebtoken` uses, so the crypto is matched, not a soft reference impl);
# `bench` adds `jsonwebtoken` as the real-world JWT baseline. The demo stays zero-dep.
jsonwebtoken = { version = "9", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
ring = { version = "0.17", optional = true }

[features]
real-crypto = ["dep:ring"]
bench = ["real-crypto", "dep:jsonwebtoken", "dep:serde"]

[[bin]]
name = "dst"
path = "src/main.rs"
